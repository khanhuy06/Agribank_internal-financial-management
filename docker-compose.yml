# =========================================================
# HỆ THỐNG QUẢN LÝ TÀI CHÍNH AGRIBANK (CHI NHÁNH HOÀN LÃO)
# DOCKER COMPOSE CHO VPS & PRODUCTION DEPLOYMENT
# =========================================================
version: '3.8'

services:
  # 1. THÙNG DATABASE POSTGRESQL CHUYÊN NGHIỆP (ĐỘC LẬP)
  db:
    image: postgres:15-alpine
    container_name: agribank_postgres_db
    restart: always
    environment:
      POSTGRES_USER: agribank_admin
      POSTGRES_PASSWORD: agribank_secure_password_2026
      POSTGRES_DB: agribank_financial_db
    volumes:
      # Volume riêng biệt: Kể cả khi nâng cấp hoặc nhân bản web thì Database KHÔNG HỀ BỊ MẤT
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agribank_admin -d agribank_financial_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. THÙNG MÁY CHỦ WEB & BACKEND (FASTAPI + FRONTEND)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agribank_web_server
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Kết nối trực tiếp vào thùng db nội bộ qua mạng docker
      - DATABASE_URL=postgresql://agribank_admin:agribank_secure_password_2026@db:5432/agribank_financial_db
      - SECRET_KEY=agribank_jwt_production_secret_key_random_change_me_9999
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      # Gắn thư mục frontend để web server phục vụ trực tiếp
      - ./frontend:/app/frontend:ro
    ports:
      - "8000:8000"

# KHU VỰC LƯU TRỮ VĨNH VIỄN CỦA POSTGRESQL
volumes:
  postgres_data:
    driver: local
